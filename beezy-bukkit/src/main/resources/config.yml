# Beezy server plugin.
# It learns only that a player uses Beezy, its version, the features they switched on and how
# the transfers this server asked for went.
# No telemetry, no update checks: it never connects to anything.

# Log every Hello, transfer result, malformed message and skipped send.
debug: false

# What the API does when something cannot be sent (feature switched off, a client limit such as
# 5 notifications every 10 s or 1 transfer a minute, the player left):
#   skip   drop it; API calls report it in their result (default)
#   throw  API calls throw an exception (BeezyException) - for plugins that want to know
delivery-policy: skip

# Discord rich presence sent to Beezy players when they join (only shown to Discord if they
# enabled Discord Rich Presence in Beezy). Leave game empty to send nothing; other plugins can
# send their own through the API.
rich-presence:
  game: ""                  # e.g. "My Server", at most 32 bytes
  mode: ""                  # at most 32 bytes
  state: ""                 # e.g. "In the lobby", at most 64 bytes

# Send each Beezy player the online members of their scoreboard team (minimap and direction HUD).
# Not available on Folia.
team-sync:
  enabled: false
  interval-ticks: 40        # how often, 20 ticks = 1 second (minimum 10)
  positions: true           # include positions, so far-away mates still show
