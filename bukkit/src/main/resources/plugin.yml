name: Beezy
version: '${version}'
main: dev.beezy.server.bukkit.BeezyPlugin
description: Shows waypoints, notifications, cooldowns, timers, teams and rich presence to Beezy Client players.
author: imBuzz
# Ignored by 1.8-1.12 servers; on 1.13+ it means "not a legacy plugin".
api-version: '1.13'
folia-supported: true
commands:
  beezy:
    description: Beezy server features.
    usage: /beezy [check|notify|waypoint|reset]
permissions:
  beezy.admin:
    description: Every /beezy command.
    default: op
    children:
      beezy.command.help: true
      beezy.command.check: true
      beezy.command.notify: true
      beezy.command.waypoint: true
      beezy.command.reset: true
  beezy.command.help:
    description: /beezy (help).
    default: op
  beezy.command.check:
    description: /beezy check - see whether a player uses Beezy, its version and features.
    default: op
  beezy.command.notify:
    description: /beezy notify - send a notification.
    default: op
  beezy.command.waypoint:
    description: /beezy waypoint - add, remove or clear waypoints.
    default: op
  beezy.command.reset:
    description: /beezy reset - clear everything the server sent to a player.
    default: op
