name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            bukkit/build/libs/*.jar
            api/build/libs/*.jar
