name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Java 25: runs Gradle and the MockBukkit integration tests (paper-api 26.3). Everything
      # that ships is still compiled for Java 8 with --release 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            beezy-bukkit/build/libs/Beezy-Bukkit-*.jar
            beezy-api/build/libs/*.jar
            beezy-protocol/build/libs/*.jar
